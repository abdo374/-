<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الامتحان الإلكتروني</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f3f5fa;--cd:#fff;--tx:#1a2340;--mu:#6a7391;--pr:#4338ca;--pl:#eef0ff;--ok:#15803d;--okb:#dcfce7;--no:#dc2626;--nob:#fee2e2;--fl:#f59e0b;--bd:#e0e5f1}
@media(prefers-color-scheme:dark){:root{--bg:#0e1325;--cd:#171e37;--tx:#edf0fb;--mu:#98a2c5;--pr:#8f8aff;--pl:#242c52;--okb:#12351f;--nob:#3a1717;--bd:#2a3354}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;line-height:1.8;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,textarea{font-family:inherit;font-size:16px;color:var(--tx)}button{cursor:pointer;border:0}
.hide{display:none!important}
.btn{background:var(--pr);color:#fff;font-weight:700;padding:10px 22px;border-radius:12px}.btn.g{background:var(--cd);color:var(--pr);border:1.5px solid var(--pr)}.btn.r{background:var(--no)}.btn.s{padding:5px 12px;font-size:14px;border-radius:9px}
.st{max-width:640px;margin:0 auto;padding:20px}
.hero{background:linear-gradient(135deg,#4338ca,#7c3aed);color:#fff;border-radius:22px;padding:26px 22px;text-align:center}.hero h1{margin:0 0 4px;font-size:24px}.hero p{margin:0;opacity:.9}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-top:14px}.cd li{margin:4px 0}
input,textarea{width:100%;background:var(--bg);border:1.5px solid var(--bd);border-radius:12px;padding:10px 12px;margin:6px 0 10px}textarea{min-height:220px;direction:rtl}
label{font-weight:600;font-size:14px}
.bar{position:sticky;top:0;z-index:20;background:var(--cd);border-bottom:1px solid var(--bd);padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;justify-content:space-between}
.tm{font-weight:800;font-size:20px;color:var(--pr);font-variant-numeric:tabular-nums}.tm.lo{color:var(--no)}.sm{font-size:13px;color:var(--mu)}
.lay{max-width:1000px;margin:0 auto;padding:14px;display:grid;grid-template-columns:1fr 250px;gap:14px;align-items:start}
.q{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px;scroll-margin-top:70px}
.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.qn{background:var(--pl);color:var(--pr);font-weight:800;border-radius:10px;padding:1px 12px}
.fg{background:none;color:var(--mu);font-size:14px;padding:2px 8px}.fg.on{color:var(--fl);font-weight:700}
.qt{font-weight:600;font-size:17px;margin:4px 0 10px}
.ch{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--bd);border-radius:12px;margin-bottom:8px;cursor:pointer;font-size:15.5px}.ch:hover{border-color:var(--pr)}.ch.s{border-color:var(--pr);background:var(--pl)}
.ch b{min-width:24px;height:24px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-size:13px;flex:none;margin-top:3px}.ch.s b{background:var(--pr);color:#fff}
.ch.c{background:var(--okb);border-color:var(--ok)}.ch.w{background:var(--nob);border-color:var(--no)}.ch.c b{background:var(--ok);color:#fff}.ch.w b{background:var(--no);color:#fff}
.nv{position:sticky;top:64px}.gr{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}
.nb{height:38px;border-radius:9px;background:var(--bg);border:1.5px solid var(--bd);color:var(--tx);font-weight:600;position:relative}
.nb.a{background:var(--pr);color:#fff;border-color:var(--pr)}.nb.f::after{content:"";position:absolute;top:0;right:0;border:7px solid transparent;border-top-color:var(--fl);border-right-color:var(--fl)}
.nb.c{background:var(--ok);color:#fff;border-color:var(--ok)}.nb.w{background:var(--no);color:#fff;border-color:var(--no)}
.fab{display:none}
.md{position:fixed;inset:0;background:rgba(10,14,30,.6);display:grid;place-items:center;z-index:50;padding:20px}.md>div{background:var(--cd);border-radius:18px;padding:22px;max-width:420px;width:100%;max-height:90vh;overflow:auto}
.sc{font-size:56px;font-weight:800;color:var(--pr);text-align:center;line-height:1.2}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.sg div{background:var(--bg);border-radius:12px;text-align:center;padding:8px;font-size:13px;color:var(--mu)}.sg b{display:block;font-size:20px;color:var(--tx)}
.ans{margin-top:8px;font-size:14px;background:var(--okb);border-radius:10px;padding:8px 12px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--bd)}
@media(max-width:820px){.lay{grid-template-columns:1fr}.nv{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:30;background:var(--cd);border-top:1px solid var(--bd);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0;transform:translateY(110%);transition:.25s;max-height:70vh;overflow:auto}.nv.op{transform:none}.fab{display:inline-block}}
</style></head><body>
<div id="app"></div><div id="md" class="md hide"><div id="mb"></div></div>
<script>
/* ====== ضع بيانات مشروعك هنا (Settings > API) ====== */
const SB_URL='https://sragxpnmmgrtdesenuqh.supabase.co', SB_KEY='sb_publishable__ZMBKOMxYOPfkc9PcG_p9g_h4FV_NuN';
const ADMIN_EMAIL='abdosabty2010@gmail.com'; // إيميل مستخدم الأدمن في Supabase (مش سر)
/* ==================================================== */
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id),L='أبجد';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sh=a=>{a=a.slice();for(let i=a.length;i>1;){let j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const view=h=>$('app').innerHTML=h, msg=t=>view(`<div class="st"><div class="cd" style="text-align:center">${t}</div></div>`);
const modal=h=>{$('mb').innerHTML=h;$('md').classList.remove('hide')}, close=()=>$('md').classList.add('hide');
const fm=s=>String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');

/* ================= الطالب ================= */
let X,Q,A,F,T,iv,done,NAME,SLUG;
async function student(){
  SLUG=new URLSearchParams(location.search).get('e')||'';
  msg('جارٍ التحميل...');
  const {data,error}=await sb.rpc('quiz_get_exam',{p_slug:SLUG});
  if(error||!data)return msg('الامتحان غير موجود أو غير متاح.');
  if(data.error==='not_open')return msg('لم يبدأ الامتحان بعد.<br>موعد البدء: '+new Date(data.opens_at).toLocaleString('ar-EG'));
  if(data.error==='closed')return msg('انتهى وقت هذا الامتحان.');
  X=data;
  view(`<div class="st"><div class="hero"><h1>🕌 ${esc(X.title)}</h1><p>${X.questions.length} سؤال • ${X.duration} دقيقة</p></div>
  <div class="cd"><b>تعليمات</b><ul><li>جميع الأسئلة في صفحة واحدة ويمكنك التنقل بينها.</li><li>استخدم 🚩 لتعليم سؤال للعودة إليه.</li><li>النتيجة والإجابات الصحيحة تظهر بعد التسليم فقط.</li><li>عند انتهاء الوقت يُسلَّم الامتحان تلقائيًا.</li></ul>
  <label>اسمك الثلاثي</label><input id="nm" placeholder="اكتب اسمك"><button class="btn" style="width:100%" onclick="begin()">ابدأ الامتحان</button></div></div>`);
}
function begin(){
  NAME=$('nm').value.trim();if(NAME.length<3)return alert('اكتب اسمك أولًا');
  Q=sh(X.questions).map(q=>({id:q.id,q:q.text,o:sh(q.options.map((t,i)=>({t,i})))}));A=[];F=[];done=0;T=X.duration*60;
  view(`<div class="bar"><span class="tm" id="tm">${fm(T)}</span><span class="sm" id="cn"></span><span><button class="btn g s fab" onclick="$('nv').classList.toggle('op')">📋 الأسئلة</button> <button class="btn s" onclick="ask()">تسليم</button></span></div>
  <div class="lay"><div>${Q.map((x,i)=>`<div class="q" id="q${i}"><div class="qh"><span class="qn">${i+1}</span><button class="fg" id="f${i}" onclick="flag(${i})">🚩 تعليم</button></div><div class="qt">${esc(x.q)}</div>${x.o.map((o,k)=>`<div class="ch" onclick="pick(${i},${o.i})"><b>${L[k]||k+1}</b><span>${esc(o.t)}</span></div>`).join('')}</div>`).join('')}</div>
  <aside class="nv" id="nv"><b>لوحة الأسئلة</b><div class="gr">${Q.map((_,i)=>`<button class="nb" id="n${i}" onclick="jump(${i})">${i+1}</button>`).join('')}</div><div class="sm">🟦 تمت الإجابة &nbsp; 🟧 معلَّم</div><button class="btn" style="width:100%;margin-top:10px" onclick="ask()">إنهاء المحاولة</button></aside></div>`);
  upd();scrollTo(0,0);iv=setInterval(()=>{T--;$('tm').textContent=fm(Math.max(T,0));$('tm').classList.toggle('lo',T<300);if(T<=0)fin()},1000)}
const pick=(i,oi)=>{if(!done){A[i]=oi;upd()}}, flag=i=>{if(!done){F[i]=!F[i];upd()}}, jump=i=>{$('q'+i).scrollIntoView({behavior:'smooth'});$('nv').classList.remove('op')};
function upd(){let c=0;Q.forEach((x,i)=>{const a=A[i]!==undefined;c+=a;$('n'+i).className='nb'+(a?' a':'')+(F[i]?' f':'');$('f'+i).classList.toggle('on',!!F[i]);$('f'+i).textContent=F[i]?'🚩 معلَّم':'🚩 تعليم';[...$('q'+i).querySelectorAll('.ch')].forEach((e,k)=>e.classList.toggle('s',A[i]===x.o[k].i))});$('cn').textContent='أُجيب '+c+' من '+Q.length}
function ask(){const u=Q.length-Q.filter((_,i)=>A[i]!==undefined).length;modal(`<h3 style="margin:0 0 8px">تسليم الامتحان؟</h3><p>غير المجابة: <b>${u}</b><br>المعلَّمة: <b>${F.filter(Boolean).length}</b></p><p class="sm">بعد التسليم لا يمكن تغيير الإجابات.</p><div style="display:flex;gap:8px"><button class="btn" style="flex:1" onclick="fin()">تسليم نهائي</button><button class="btn g" style="flex:1" onclick="close()">رجوع</button></div>`)}
async function fin(){
  if(done)return;done=1;clearInterval(iv);modal('<p style="text-align:center">جارٍ التسليم...</p>');
  const ans={};Q.forEach((x,i)=>{if(A[i]!==undefined)ans[x.id]=A[i]});
  const {data,error}=await sb.rpc('quiz_submit_exam',{p_slug:SLUG,p_name:NAME,p_answers:ans});
  if(error||!data){done=0;return modal(`<p>تعذّر التسليم (تحقق من الاتصال) ولم تضِع إجاباتك.</p><button class="btn" style="width:100%" onclick="fin()">إعادة المحاولة</button>`)}
  let r=0,w=0,s=0;
  Q.forEach((x,i)=>{const ci=data.correct[x.id],n=$('n'+i);n.className='nb';
    if(A[i]===undefined)s++;else if(A[i]===ci){r++;n.classList.add('c')}else{w++;n.classList.add('w')}
    [...$('q'+i).querySelectorAll('.ch')].forEach((e,k)=>{e.classList.remove('s');e.style.cursor='default';e.onclick=null;const oi=x.o[k].i;if(oi===ci)e.classList.add('c');else if(oi===A[i])e.classList.add('w')});
    if(A[i]!==ci)$('q'+i).insertAdjacentHTML('beforeend',`<div class="ans">✔ الإجابة الصحيحة: ${esc(x.o.find(o=>o.i===ci).t)}</div>`)});
  const p=Math.round(r/Q.length*100);$('tm').textContent='تم التسليم';
  modal(`<div class="sc">${r} / ${Q.length}</div><p style="text-align:center;font-weight:700;margin:0">${p}% — ${p>=90?'🏆 ممتاز':p>=75?'👏 جيد جدًا':p>=60?'📖 جيد':p>=50?'مقبول':'🔁 يحتاج مراجعة'}</p><div class="sg"><div><b style="color:var(--ok)">${r}</b>صحيحة</div><div><b style="color:var(--no)">${w}</b>خاطئة</div><div><b>${s}</b>بدون إجابة</div></div><button class="btn" style="width:100%" onclick="close();scrollTo(0,0)">مراجعة الإجابات</button>`)}

/* ================= لوحة المعلّم (index.html#admin) ================= */
async function admin(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return view(`<div class="st"><div class="hero"><h1>لوحة المعلّم</h1></div><div class="cd"><label>كلمة المرور</label><input id="pw" type="password" onkeydown="if(event.key==='Enter')login()"><button class="btn" style="width:100%" onclick="login()">دخول</button></div></div>`);
  const {data:ex,error}=await sb.from('quiz_exams').select('*').order('created_at',{ascending:false});
  if(error)return msg('خطأ: '+esc(error.message));
  const base=location.origin+location.pathname;
  view(`<div class="st"><div class="hero"><h1>لوحة المعلّم</h1><p><button class="btn g s" onclick="sb.auth.signOut().then(admin)">خروج</button></p></div>
  <div class="cd"><b>➕ امتحان جديد</b><br><label>العنوان</label><input id="ti"><label>اسم الرابط (اختياري – حروف إنجليزية وأرقام، مثل hadith1)</label><input id="sl" dir="ltr" placeholder="يُولَّد تلقائيًا لو تركته فارغًا"><label>المدة بالدقائق</label><input id="du" type="number" value="45">
  <label>يفتح في (اختياري)</label><input id="op" type="datetime-local"><label>يغلق في (اختياري)</label><input id="cl" type="datetime-local">
  <label>الأسئلة (س: السؤال / * الصحيحة / - الخاطئة)</label><textarea id="tx" placeholder="س: السؤال؟&#10;* الإجابة الصحيحة&#10;- خاطئة&#10;- خاطئة&#10;- خاطئة"></textarea>
  <button class="btn" style="width:100%" onclick="create()">حفظ وإنشاء الرابط</button></div>
  <div class="cd"><b>📚 امتحاناتي</b>${ex.length?ex.map(e=>`<div class="row"><div><b>${esc(e.title)}</b><div class="sm">${e.published?'🟢 منشور':'⚪ مخفي'} • ${new Date(e.created_at).toLocaleDateString('ar-EG')}</div></div><div>
  <button class="btn g s" onclick="navigator.clipboard.writeText('${base}?e=${e.slug}').then(()=>alert('تم نسخ الرابط'))">🔗 الرابط</button>
  <button class="btn g s" onclick="res('${e.id}')">النتائج</button>
  <button class="btn g s" onclick="tog('${e.id}',${!e.published})">${e.published?'إخفاء':'نشر'}</button>
  <button class="btn r s" onclick="del('${e.id}')">حذف</button></div></div>`).join(''):'<p class="sm">لا توجد امتحانات بعد.</p>'}</div></div>`)}
async function login(){
  if(ADMIN_EMAIL.startsWith('PASTE'))return alert('لم تضع إيميل الأدمن في أول السكريبت (ADMIN_EMAIL)');
  const {error}=await sb.auth.signInWithPassword({email:ADMIN_EMAIL.trim(),password:$('pw').value.trim()});
  if(!error)return admin();
  const m=error.message||'';
  alert(/not confirmed/i.test(m)?'الإيميل غير مفعّل: في Supabase افتح المستخدم واضغط Confirm، أو أعد إنشاءه مع Auto Confirm':/invalid login/i.test(m)?'الإيميل أو كلمة المرور غير مطابقين للمستخدم في Supabase.\nتأكد أن ADMIN_EMAIL في الملف هو نفس إيميل المستخدم بالظبط.':'خطأ: '+m)}
function parse(t){const qs=[];let c=null;for(let l of t.split('\n')){l=l.trim();if(!l)continue;
  if(/^س\s*[:：]/.test(l)){c={text:l.replace(/^س\s*[:：]/,'').trim(),o:[],c:-1};qs.push(c)}
  else if(c&&l[0]==='*'){c.c=c.o.length;c.o.push(l.slice(1).trim())}
  else if(c&&l[0]==='-')c.o.push(l.slice(1).trim());
  else if(c&&!c.o.length)c.text+=' '+l}return qs}
async function create(){
  const qs=parse($('tx').value),t=$('ti').value.trim();
  if(!t)return alert('اكتب عنوان الامتحان');if(!qs.length)return alert('لم أجد أسئلة');
  const bad=qs.findIndex(q=>q.c<0||q.o.length<2);if(bad>=0)return alert('السؤال رقم '+(bad+1)+' ينقصه إجابة صحيحة (*) أو خيارات');
  const slug=$('sl').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'')||Math.random().toString(36).slice(2,8);
  const v=id=>$(id).value?new Date($(id).value).toISOString():null;
  const {data:e,error}=await sb.from('quiz_exams').insert({slug,title:t,duration_min:+$('du').value||45,opens_at:v('op'),closes_at:v('cl')}).select().single();
  if(error)return alert(error.code==='23505'?'اسم الرابط مستخدم من قبل، اختر اسمًا آخر':error.message);
  const {error:e2}=await sb.from('quiz_questions').insert(qs.map((q,i)=>({exam_id:e.id,position:i,text:q.text,options:q.o,correct:q.c})));
  if(e2){await sb.from('quiz_exams').delete().eq('id',e.id);return alert(e2.message)}
  const link=location.origin+location.pathname+'?e='+slug;
  await admin();modal(`<h3 style="margin:0 0 8px">✅ تم إنشاء الامتحان (${qs.length} سؤال)</h3><input readonly value="${link}" onclick="this.select()"><button class="btn" style="width:100%" onclick="navigator.clipboard.writeText('${link}');close()">نسخ الرابط</button>`)}
async function tog(id,p){await sb.from('quiz_exams').update({published:p}).eq('id',id);admin()}
async function del(id){if(confirm('حذف الامتحان ونتائجه نهائيًا؟')){await sb.from('quiz_exams').delete().eq('id',id);admin()}}
async function res(id){const {data}=await sb.from('quiz_submissions').select('*').eq('exam_id',id).order('score',{ascending:false});
  if(!data.length)return modal('<p>لا توجد نتائج بعد.</p><button class="btn g" onclick="close()">إغلاق</button>');
  const avg=(data.reduce((a,d)=>a+d.score/d.total,0)/data.length*100).toFixed(0);
  window._csv='الاسم,الدرجة,من,التاريخ\n'+data.map(d=>`"${d.student_name.replace(/"/g,'""')}",${d.score},${d.total},${new Date(d.created_at).toLocaleString('ar-EG')}`).join('\n');
  modal(`<b>${data.length} طالب • المتوسط ${avg}%</b><table><tr><th>الاسم</th><th>الدرجة</th></tr>${data.map(d=>`<tr><td>${esc(d.student_name)}</td><td>${d.score}/${d.total}</td></tr>`).join('')}</table><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" style="flex:1" onclick="dl()">تحميل CSV</button><button class="btn g" style="flex:1" onclick="close()">إغلاق</button></div>`)}
function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+window._csv],{type:'text/csv'}));a.download='results.csv';a.click()}
/* تشغيل الصفحة بعد تعريف كل المتغيرات */
location.hash==='#admin'?admin():student();
</script></body></html>
